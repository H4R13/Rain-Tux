; Lines starting ; (semicolons) are commented out.
; That is, they do not affect the code and are here for demonstration purposes only.
; ----------------------------------

[Rainmeter]
; This section contains general settings that can be used to change how the skin behaves.
Update=1000

[Metadata]
; Contains basic information of the skin.
Name=Welcome
Author=poiru (illustro for Rainmeter); RainTux edition by Viktor_Hashmat
Information=The welcome skin for illustro (RainTux edition).
License=Creative Commons BY-NC-SA 3.0
Version=1.1.0

[Variables]
; Variables declared here can be used later on between two # characters (e.g. #MyVariable#).
fontName=Trebuchet MS
textSize=9
colorBar=235,170,0,255
colorText=255,255,255,205

; ----------------------------------
; STYLES are used to "centralize" options
; ----------------------------------

[styleTitle]
StringAlign=Left
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1
ClipString=1

[styleLeftText]
StringAlign=Left
; Meters using styleLeftText will be left-aligned.
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,20
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleSeperator]
SolidColor=255,255,255,15

; ----------------------------------
; METERS display images, text, bars, etc.
; ----------------------------------

[meterBackground]
Meter=Image
ImageName=Background.png
X=0
Y=0

[meterMidLine]
Meter=Image
SolidColor=255,255,255,80
W=1
H=200
X=245
Y=60

[meterTitle]
Meter=String
MeterStyle=styleTitle
; Using MeterStyle=styleTitle will basically "copy" the
; contents of the [styleTitle] section here during runtime.
X=20
Y=18
W=400
H=18
FontSize=11
Text=Welcome to RainTux!

[meterIllustroTitle]
Meter=String
MeterStyle=styleLeftText
X=20
Y=55
W=240
H=30
FontColor=255,217,120,255
FontSize=10
Text=illustro: Getting started with RainTux skinning

[meterIllustroLine]
Meter=String
MeterStyle=styleLeftText
X=20
Y=95
W=225
H=175
FontColor=#colorText#
FontSize=9
Text=illustro is a simple set of skins, originally made for Rainmeter by poiru, that shows some of what RainTux can do. It is a good place to start learning: open any illustro .ini file in a text editor, change it and refresh the skin.#CRLF##CRLF#To browse installed skins and change settings, right-click any skin or open Manage.
; #CRLF# is a pre-defined variable for newline.

