[Rainmeter]
Update=1000
AccurateText=1
@Include=#@#Variables.inc
@Include2=#@#Styles.inc

[Metadata]
Name=Clock
Author=RainTux
Information=Time, date and a seconds ring. Right-click for options; drag to move.
Version=1.0
License=MIT

; ---------------------------------------------------------------- measures
[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureSeconds]
Measure=Time
Format=%S

[MeasureDate]
Measure=Time
Format=%A, %#d %B

[MeasureSecond]
; Time measures return seconds since 1601; the remainder is the current second.
Measure=Calc
Formula=Floor(MeasureTime % 60)
MinValue=0
MaxValue=60

; ---------------------------------------------------------------- meters
[MeterBackground]
Meter=Shape
Shape=Rectangle 0.5,0.5,#Width#,112,#Radius# | Fill Color #Panel# | StrokeWidth 1 | Stroke Color #PanelBorder#

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=18
Y=10
FontFace=#FontFace#
FontSize=40
FontWeight=300
FontColor=#Text#
AntiAlias=1
Text=%1

[MeterDate]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureDate
X=20
Y=-2R
FontColor=#SubText#
Text=%1

[MeterRingTrack]
Meter=Roundline
X=(#Width#-96)
Y=14
W=84
H=84
LineStart=37
LineLength=41
Solid=1
ControlAngle=0
LineColor=#Track#
AntiAlias=1

[MeterRing]
Meter=Roundline
MeasureName=MeasureSecond
X=0r
Y=0r
W=84
H=84
StartAngle=(Rad(270))
RotationAngle=(Rad(360))
LineStart=37
LineLength=41
Solid=1
LineColor=#Accent#,255
AntiAlias=1

[MeterSeconds]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureSeconds
X=42r
Y=42r
StringAlign=CenterCenter
FontSize=15
Text=%1
