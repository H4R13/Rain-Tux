[Rainmeter]
Update=1000
AccurateText=1
@Include=#@#Variables.inc
@Include2=#@#Styles.inc

[Metadata]
Name=System
Author=RainTux
Information=CPU, memory, swap and disk usage with a CPU history graph.
Version=1.0
License=MIT

; ---------------------------------------------------------------- measures
[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory
UpdateDivider=2

[MeasureRAMTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

[MeasureSwap]
Measure=SwapMemory
UpdateDivider=2

[MeasureSwapTotal]
Measure=SwapMemory
Total=1
UpdateDivider=-1

[MeasureDiskUsed]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
UpdateDivider=30

[MeasureDiskTotal]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=-1

; ---------------------------------------------------------------- meters
[MeterBackground]
Meter=Shape
Shape=Rectangle 0.5,0.5,#Width#,226,#Radius# | Fill Color #Panel# | StrokeWidth 1 | Stroke Color #PanelBorder#

[MeterHeading]
Meter=String
MeterStyle=StyleHeading
X=18
Y=14
Text=System

[MeterCPUGraph]
Meter=Line
MeasureName=MeasureCPU
X=18
Y=34
W=(#Width#-36)
H=34
LineCount=1
LineColor=#Accent#,255
LineWidth=1.5
AntiAlias=1

; CPU
[MeterCPULabel]
Meter=String
MeterStyle=StyleText
X=18
Y=76
Text=CPU

[MeterCPUValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCPU
X=(#Width#-18)
Y=0r
Text=%1%

[MeterCPUBar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureCPU
X=18
Y=98
W=(#Width#-36)
H=4

; Memory
[MeterRAMLabel]
Meter=String
MeterStyle=StyleText
X=18
Y=110
Text=Memory

[MeterRAMValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureRAM
MeasureName2=MeasureRAMTotal
X=(#Width#-18)
Y=0r
AutoScale=1
NumOfDecimals=1
Text=%1B / %2B

[MeterRAMBar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureRAM
X=18
Y=132
W=(#Width#-36)
H=4

; Swap
[MeterSwapLabel]
Meter=String
MeterStyle=StyleText
X=18
Y=144
Text=Swap

[MeterSwapValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureSwap
MeasureName2=MeasureSwapTotal
X=(#Width#-18)
Y=0r
AutoScale=1
NumOfDecimals=1
Text=%1B / %2B

[MeterSwapBar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureSwap
X=18
Y=166
W=(#Width#-36)
H=4

; Disk
[MeterDiskLabel]
Meter=String
MeterStyle=StyleText
X=18
Y=178
Text=Disk /

[MeterDiskValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureDiskUsed
MeasureName2=MeasureDiskTotal
X=(#Width#-18)
Y=0r
AutoScale=1
NumOfDecimals=0
Text=%1B / %2B

[MeterDiskBar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureDiskUsed
X=18
Y=200
W=(#Width#-36)
H=4
