[Rainmeter]
Update=1000
AccurateText=1
@Include=#@#Variables.inc
@Include2=#@#Styles.inc

[Metadata]
Name=Network
Author=RainTux
Information=Download and upload rates with history graphs.
Version=1.0
License=MIT

[Variables]
Upload=255,170,90

; ---------------------------------------------------------------- measures
[MeasureIn]
Measure=NetIn

[MeasureOut]
Measure=NetOut

; ---------------------------------------------------------------- meters
[MeterBackground]
Meter=Shape
Shape=Rectangle 0.5,0.5,#Width#,142,#Radius# | Fill Color #Panel# | StrokeWidth 1 | Stroke Color #PanelBorder#

[MeterHeading]
Meter=String
MeterStyle=StyleHeading
X=18
Y=14
Text=Network

[MeterGraph]
Meter=Line
MeasureName=MeasureIn
MeasureName2=MeasureOut
X=18
Y=34
W=(#Width#-36)
H=46
LineCount=2
LineColor=#Accent#,255
LineColor2=#Upload#,255
LineWidth=1.5
AutoScale=1
AntiAlias=1

[MeterInLabel]
Meter=String
MeterStyle=StyleText
X=18
Y=90
Text=Download
InlineSetting=Color | #Accent#,255
InlinePattern=^.

[MeterInValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureIn
X=(#Width#-18)
Y=0r
AutoScale=1
Text=%1B/s

[MeterOutLabel]
Meter=String
MeterStyle=StyleText
X=18
Y=114
Text=Upload
InlineSetting=Color | #Upload#,255
InlinePattern=^.

[MeterOutValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureOut
X=(#Width#-18)
Y=0r
AutoScale=1
Text=%1B/s
