[Rainmeter]
Update=1000
AccurateText=1
@Include=#@#Variables.inc
@Include2=#@#Styles.inc

[Metadata]
Name=Welcome
Author=RainTux
Information=First-run guide. Close it with the × button or from the right-click menu.
Version=1.0
License=MIT

[Variables]
W=470
ManageFill=255,255,255,18
FolderFill=255,255,255,18
GetFill=255,255,255,18
CloseColor=150,160,176

[MeterBackground]
Meter=Shape
Shape=Rectangle 0.5,0.5,#W#,250,18 | Fill Color #Panel# | StrokeWidth 1 | Stroke Color #PanelBorder#

[MeterTitle]
Meter=String
X=28
Y=24
FontFace=#FontFace#
FontSize=20
FontWeight=600
FontColor=#Text#
AntiAlias=1
Text=Welcome to RainTux
InlineSetting=Color | #Accent#,255
InlinePattern=RainTux

[MeterBody]
Meter=String
MeterStyle=StyleText
X=30
Y=8R
W=(#W#-60)
ClipString=2
FontColor=#SubText#
Text=Desktop skins for Linux that read Rainmeter skins. Drag a skin to move it, right-click it for its settings, and install .rmskin packages from Manage.

[MeterClose]
Meter=String
X=(#W#-26)
Y=14
FontFace=#FontFace#
FontSize=14
FontColor=#CloseColor#
StringAlign=Center
AntiAlias=1
Text=×
DynamicVariables=1
MouseOverAction=[!SetVariable CloseColor "255,110,110"][!UpdateMeter MeterClose][!Redraw]
MouseLeaveAction=[!SetVariable CloseColor "150,160,176"][!UpdateMeter MeterClose][!Redraw]
LeftMouseUpAction=[!DeactivateConfig]
ToolTipText=Close

; ---------------------------------------------------------------- buttons
[MeterManage]
Meter=Shape
X=28
Y=176
Shape=Rectangle 0,0,128,40,10 | Fill Color #ManageFill# | StrokeWidth 0
DynamicVariables=1
MouseOverAction=[!SetVariable ManageFill "#Accent#,90"][!UpdateMeter MeterManage][!Redraw]
MouseLeaveAction=[!SetVariable ManageFill "255,255,255,18"][!UpdateMeter MeterManage][!Redraw]
LeftMouseUpAction=[!Manage]

[MeterManageLabel]
Meter=String
MeterStyle=StyleText
X=64r
Y=20r
StringAlign=CenterCenter
Text=Manage skins

[MeterFolder]
Meter=Shape
X=(28+128+12)
Y=176
Shape=Rectangle 0,0,128,40,10 | Fill Color #FolderFill# | StrokeWidth 0
DynamicVariables=1
MouseOverAction=[!SetVariable FolderFill "#Accent#,90"][!UpdateMeter MeterFolder][!Redraw]
MouseLeaveAction=[!SetVariable FolderFill "255,255,255,18"][!UpdateMeter MeterFolder][!Redraw]
LeftMouseUpAction=["#SKINSPATH#"]

[MeterFolderLabel]
Meter=String
MeterStyle=StyleText
X=64r
Y=20r
StringAlign=CenterCenter
Text=Skins folder

[MeterGet]
Meter=Shape
X=(28+2*(128+12))
Y=176
Shape=Rectangle 0,0,138,40,10 | Fill Color #GetFill# | StrokeWidth 0
DynamicVariables=1
MouseOverAction=[!SetVariable GetFill "#Accent#,90"][!UpdateMeter MeterGet][!Redraw]
MouseLeaveAction=[!SetVariable GetFill "255,255,255,18"][!UpdateMeter MeterGet][!Redraw]
LeftMouseUpAction=["https://www.deviantart.com/rainmeter"]

[MeterGetLabel]
Meter=String
MeterStyle=StyleText
X=69r
Y=20r
StringAlign=CenterCenter
Text=Get more skins
